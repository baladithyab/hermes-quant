# Catalyst Sense — curated propagation graph (ADR-0074, D74.2)
#
# The "butterfly engine" edge set: how a catalyst on a SOURCE entity propagates
# to touched SYMBOLS. Operator-editable. Falls back to the built-in seed in
# hermes_quant/catalyst/propagation.py if this file is missing/malformed.
#
# effect_sign = sign of the propagated effect for a NEGATIVE catalyst on the
#   source. A POSITIVE catalyst flips it automatically.
#     -1  negative catalyst on source -> BEARISH for target (sector contagion)
#     +1  negative catalyst on source -> BULLISH for target (competitor relief)
# weight = 0..1 linkage strength -> drives packet CONFIDENCE (not magnitude).
#
# *** EDGE SIGN IS THE HIGHEST-RISK FIELD — REVIEW IT. *** A competitor's failure
# can be read as bearish (sector confidence shock, the empirically dominant
# short-horizon effect for catastrophic events) OR bullish (less competition).
# v1 encodes the contagion reading; every propagation is logged so a learned
# graph can correct signs later. The eval gate (catalyst.eval) guards precision.

aliases:
  blue origin: blue origin
  new glenn: blue origin
  bezos: blue origin
  jeff bezos: blue origin
  rocket lab: rocket lab
  spacex: spacex
  taiwan earthquake: taiwan earthquake
  tsmc: tsmc
  taiwan semiconductor: tsmc
  boeing: boeing
  tesla: tesla
  bank failure: bank failure
  bank collapse: bank failure
  # --- consumer-trend entity class (ADR-0074 Phase-1, social-arbitrage) ---
  # Brand/product surfaces -> canonical entity. ENTITY aliases ONLY — never person
  # names (the person-alias-contamination lesson: a founder spans sectors and
  # creates false correlations). A viral trend = positive demand catalyst on maker.
  celsius: celsius energy
  celsius energy: celsius energy
  crocs: crocs
  dorel: dorel bicycle
  dorel bicycle: dorel bicycle
  coach: coach handbag
  coach handbag: coach handbag
  tapestry: coach handbag
  elmer: elmer glue
  elmer glue: elmer glue
  slime: elmer glue

edges:
  # --- space / launch ---
  blue origin:
    - {target: RKLB, relation: competitor,     effect_sign: -1, weight: 0.85}
    - {target: LUNR, relation: competitor,     effect_sign: -1, weight: 0.75}
    - {target: ASTS, relation: sector_member,  effect_sign: -1, weight: 0.70}
    - {target: RDW,  relation: sector_member,  effect_sign: -1, weight: 0.60}

  rocket lab:
    - {target: RKLB, relation: self,           effect_sign: -1, weight: 0.95}
    - {target: LUNR, relation: sector_member,  effect_sign: -1, weight: 0.45}
    - {target: ASTS, relation: sector_member,  effect_sign: -1, weight: 0.40}

  spacex:
    - {target: RKLB, relation: competitor,     effect_sign: -1, weight: 0.60}
    - {target: ASTS, relation: sector_member,  effect_sign: -1, weight: 0.55}

  # --- energy / commodity ---
  # REMOVED 2026-05-29: OPEC commodity edge was structurally unsignable by this
  # framework (oil-producer direction depends on SUPPLY direction, not event
  # polarity — "output surge crashes prices" mis-signed XOM bullish). The D74.7
  # sign-consistency check caught it. Re-add only with a supply-direction
  # classifier (LLM tier), never via the contagion mechanism.

  # --- semis / supply chain ---
  taiwan earthquake:
    - {target: TSM,  relation: supply_chain,   effect_sign: -1, weight: 0.80}
    - {target: NVDA, relation: supply_chain,   effect_sign: -1, weight: 0.50}
    - {target: AMD,  relation: supply_chain,   effect_sign: -1, weight: 0.45}

  tsmc:
    - {target: TSM,  relation: self,           effect_sign: -1, weight: 0.95}
    - {target: NVDA, relation: supply_chain,   effect_sign: -1, weight: 0.55}
    - {target: AMD,  relation: supply_chain,   effect_sign: -1, weight: 0.45}

  # --- aerospace (crash/grounding = sector + Boeing-supplier shock) ---
  boeing:
    - {target: BA,   relation: self,           effect_sign: -1, weight: 0.95}
    - {target: SPR,  relation: supply_chain,   effect_sign: -1, weight: 0.70}
    - {target: RTX,  relation: sector_member,  effect_sign: -1, weight: 0.30}

  # --- EV / autos (recall/safety on a leader -> EV basket) ---
  tesla:
    - {target: TSLA, relation: self,           effect_sign: -1, weight: 0.95}
    - {target: RIVN, relation: sector_member,  effect_sign: -1, weight: 0.50}
    - {target: LCID, relation: sector_member,  effect_sign: -1, weight: 0.45}

  # --- banks (failure = sector contagion) ---
  bank failure:
    - {target: JPM,  relation: sector_member,  effect_sign: -1, weight: 0.40}
    - {target: BAC,  relation: sector_member,  effect_sign: -1, weight: 0.50}
    - {target: WFC,  relation: sector_member,  effect_sign: -1, weight: 0.50}
    - {target: SCHW, relation: sector_member,  effect_sign: -1, weight: 0.55}

  # --- consumer-trend entity class (ADR-0074 Phase-1, social-arbitrage) ---
  # A NEW entity class: brand/product -> the public maker. effect_sign=-1 means a
  # NEGATIVE brand event (recall/scandal) is BEARISH for the maker, AND (since a
  # positive catalyst flips the sign) a VIRAL/positive trend is BULLISH — exactly
  # the social-arb thesis. brand_self weight is high (the trend IS the product).
  #
  # *** PHASE-0 EVAL CAVEAT (read before trusting these) ***
  # The D74.7 gate PASSED at exactly 0.60 hit-rate (3/5 cases): CELH/CROX/DIIBF
  # directionally correct, TPR/NWL were FALSE POSITIVES (the trend surfaced but the
  # stock fell over the forward window). This is a KNIFE-EDGE pass on n=5 — enough
  # to justify building the producer, NOT enough to grant live weight. The flag
  # HERMES_QUANT_SEMANTIC_ENABLED already gates this; do not raise consumer-trend
  # confidence weights without a larger labeled set passing a HIGHER threshold.
  celsius energy:
    - {target: CELH, relation: brand_self,     effect_sign: -1, weight: 0.90}
  crocs:
    - {target: CROX, relation: brand_self,     effect_sign: -1, weight: 0.90}
  dorel bicycle:
    - {target: DIIBF, relation: brand_self,    effect_sign: -1, weight: 0.85}
  coach handbag:
    - {target: TPR,  relation: brand_self,     effect_sign: -1, weight: 0.88}
  elmer glue:
    - {target: NWL,  relation: brand_self,     effect_sign: -1, weight: 0.85}
