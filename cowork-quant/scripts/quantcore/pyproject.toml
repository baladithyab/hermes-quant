[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcore"
version = "0.1.0"
description = "Deterministic core of cowork-quant: risk gate, Kelly sizing, paper ledger, settlement"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "hypothesis>=6.90", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["quantcore*"]

[tool.setuptools.package-data]
quantcore = ["seeds/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
