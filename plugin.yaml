name: hermes-quant
version: "0.6.4"
description: ARIA-powered multi-analyst algorithmic trading framework — sidecar daemon emits signals to a JSONL bus that freqtrade (or NautilusTrader) consumes for execution.
author: Codeseys
license: Apache-2.0
homepage: https://github.com/baladithyab/hermes-quant
manifest_version: 1
kind: standalone
platforms: [linux, macos, windows]

provides_tools:
  - quant_status
  - quant_show_signals
  - quant_show_views
  - quant_recommend
  - quant_recipes
  - quant_propose
  - quant_approve
  - quant_reject
  - quant_pending
  - quant_proposal
  - quant_autonomous_tick
  - quant_autonomous_status
  - quant_watchlist_add
  - quant_watchlist_remove
  - quant_watchlist_list
  - quant_doctor

provides_hooks:
  # pre_gateway_dispatch installs the Discord /quant slash command (register() wires
  # this one only). on_session_start was declared historically but never registered —
  # dropped to keep the manifest truthful (HERMES-INTEGRATION.md §6 checklist).
  - pre_gateway_dispatch

# Optional API keys — plugin still works without all of these set.
# yfinance bootstrap requires ZERO credentials; users opt in to Alpaca/exchange APIs.
optional_env:
  - name: ALPACA_API_KEY
    description: Required for Alpaca paper/live equity trading and SIP data feed
    url: https://alpaca.markets/
    secret: true
  - name: ALPACA_API_SECRET
    description: Required for Alpaca paper/live equity trading
    url: https://alpaca.markets/
    secret: true
  - name: BINANCE_API_KEY
    description: Optional — increases ccxt rate limits for crypto data
    url: https://www.binance.com/en/my/settings/api-management
    secret: true
  - name: BINANCE_API_SECRET
    description: Optional — required for higher Binance rate limits
    url: https://www.binance.com/en/my/settings/api-management
    secret: true
  - name: HF_TOKEN
    description: Optional — used to download Kronos foundation model weights from HuggingFace Hub
    url: https://huggingface.co/settings/tokens
    secret: true
  - name: OPENROUTER_API_KEY
    description: Optional — required only for the news-LLM analyst (deferred to v0.2)
    url: https://openrouter.ai/keys
    secret: true
  - name: MLFLOW_TRACKING_URI
    description: Optional — point the daemon at an MLflow tracking server; defaults to file backend at ~/.hermes/quant/mlruns
    secret: false

# Optional MCP servers the plugin ships as DISABLED-BY-DEFAULT, vetted candidates.
# These are NOT activated by register(ctx) (there is no register_mcp path) — each
# entry points at a manifest under mcp/optional-mcps/<name>/manifest.yaml mirroring
# the host ~/.hermes/hermes-agent/optional-mcps/<name>/manifest.yaml schema. An
# operator activates one by copying its block into ~/.hermes/config.yaml
# mcp_servers: (creds via the tool-guarded ~/.hermes/.env) and confirming reload.
# Money-write tools are NEVER auto-enabled; the deterministic risk gate (ADR-0004)
# + HITL (ADR-0015) remain the sole order authority. See:
#   docs/operations/MCP-INTEGRATION.md  (authoritative policy + enable runbook)
#   mcp/optional-mcps/README.md          (registry design)
optional_mcps:
  registry: mcp/optional-mcps
  default_enabled: false   # registry-wide default; the 4 KEYLESS read-only servers (tradingview/coingecko/yahoo-finance/sec-edgar) are enabled in config.yaml (operator opt-in 2026-05-31). Cred-gated servers stay OFF until creds loaded.
  servers:
    - name: alpaca
      manifest: mcp/optional-mcps/alpaca/manifest.yaml
      read_only: true        # as shipped (ALPACA_TOOLSETS excludes `trading`)
      money_write: false
      underlying_can_write: true
      requires_creds: true
    - name: tradingview
      manifest: mcp/optional-mcps/tradingview/manifest.yaml
      enabled: true   # keyless read-only — LIVE in config.yaml mcp_servers (2026-05-31, operator opt-in)
      read_only: true
      money_write: false
      underlying_can_write: false
      requires_creds: false
    - name: robinhood
      manifest: mcp/optional-mcps/robinhood/manifest.yaml
      read_only: true
      money_write: false
      underlying_can_write: false
      requires_creds: true
    - name: longbridge
      manifest: mcp/optional-mcps/longbridge/manifest.yaml
      read_only: true        # as shipped (--readonly)
      money_write: false
      underlying_can_write: true
      requires_creds: true
    - name: sec-edgar
      manifest: mcp/optional-mcps/sec-edgar/manifest.yaml
      enabled: true   # keyless read-only — LIVE in config.yaml mcp_servers (2026-05-31, operator opt-in)
      read_only: true
      money_write: false
      underlying_can_write: false
      requires_creds: true   # non-secret UA string
    - name: polygon
      manifest: mcp/optional-mcps/polygon/manifest.yaml
      read_only: true
      money_write: false
      underlying_can_write: false
      requires_creds: true
    - name: fred
      manifest: mcp/optional-mcps/fred/manifest.yaml
      read_only: true
      money_write: false
      underlying_can_write: false
      requires_creds: true
    - name: coingecko
      manifest: mcp/optional-mcps/coingecko/manifest.yaml
      enabled: true   # keyless read-only — LIVE in config.yaml mcp_servers (2026-05-31, operator opt-in)
      read_only: true
      money_write: false
      underlying_can_write: false
      requires_creds: false
    - name: yahoo-finance
      manifest: mcp/optional-mcps/yahoo-finance/manifest.yaml
      enabled: true   # keyless read-only — LIVE in config.yaml mcp_servers (2026-05-31, operator opt-in)
      read_only: true
      money_write: false
      underlying_can_write: false
      requires_creds: false
