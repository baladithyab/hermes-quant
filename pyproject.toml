[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-quant"
version = "0.4.4"
description = "ARIA-powered multi-analyst algorithmic trading framework, distributed as a Hermes Agent plugin."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Codeseys" }]
keywords = [
    "hermes-agent",
    "trading",
    "algorithmic-trading",
    "quant",
    "kronos",
    "freqtrade",
    "alpaca",
    "rl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "httpx>=0.25",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.40", "pyyaml>=6.0"]
# Crypto data + execution
ccxt = ["ccxt>=4.2"]
# US equities data + execution
alpaca = ["alpaca-py>=0.30"]
# Kronos foundation-model analyst (heavy: torch + HF)
kronos = [
    "torch>=2.0",
    "transformers>=4.35",
    "huggingface_hub>=0.20",
    "einops>=0.7",
    "safetensors>=0.4",
]
# Bayesian / stacking aggregator extras
stacking = ["scikit-learn>=1.3", "scipy>=1.11"]
# Backtest reporting + visualization
backtest = ["matplotlib>=3.7", "seaborn>=0.13"]
# MLflow integration (optional — defaults to file backend)
mlflow = ["mlflow>=2.10"]
# Options pricing kernel — pure-Python, vendored from optlib (MIT).
# scipy is already pulled in via [stacking]; numpy is a base dep.
# Empty extra is kept so consumers can opt-in symbolically (e.g. `pip install hermes-quant[options]`).
options = []
# Convenience: full feature set excluding GPU-only torch builds
all = [
    "hermes-quant[yfinance,ccxt,alpaca,kronos,stacking,backtest,mlflow,options]",
]
# Dev / testing
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.5",
    "ruff>=0.1",
    "mypy>=1.7",
]
# Test bundle: all optional extras the test suite touches.
# Use `uv pip install -e '.[test]'` to set up a clean dev environment that
# can run the full test suite without ModuleNotFoundError on optional deps.
# v0.6.3 (ADR none): extracted from the implicit set the suite was depending on.
test = [
    "hermes-quant[dev]",
    "hermes-quant[stacking]",
    "hermes-quant[ccxt]",
    "hermes-quant[alpaca]",
    "hermes-quant[yfinance]",
    "hermes-quant[backtest]",
    "pyarrow>=15.0",
]

[project.entry-points."hermes_agent.plugins"]
hermes-quant = "hermes_quant"

[project.entry-points."hermes_quant.analysts"]
classical_ta = "hermes_quant.analysts.classical_ta:ClassicalTAAnalyst"
microstructure_lite = "hermes_quant.analysts.microstructure:MicrostructureLite"
kronos = "hermes_quant.analysts.kronos:KronosAnalyst"
hermes_semantic = "hermes_quant.analysts.semantic:HermesSemanticAnalyst"

[project.entry-points."hermes_quant.aggregators"]
bma = "hermes_quant.aggregators.bma:BMAAggregator"
# NOTE: the `stacking` aggregator is planned (ADR-0003 reserves a logistic
# stacking aggregator; bma.py references StackingAggregator; scheduled v0.1.3).
# Its entry point is intentionally NOT declared until aggregators/stacking.py
# lands — a dangling `stacking = ...:StackingAggregator` line makes
# discover_aggregators() log a "failed to load entry point" warning on every
# daemon boot (ModuleNotFoundError). Re-add this line in the same commit that
# adds the module. The `[stacking]` dependency extra below stays — scikit-learn
# and scipy are already used (calibrators.py, factors/, options/pricing/gbs.py).
deliberative_committee = "hermes_quant.aggregators.deliberative:DeliberativeCommitteeAggregator"

[project.entry-points."hermes_quant.data_providers"]
yfinance = "hermes_quant.data.yfinance_provider:YFinanceProvider"
ccxt = "hermes_quant.data.ccxt_provider:CcxtProvider"
alpaca = "hermes_quant.data.alpaca_provider:AlpacaProvider"

[project.scripts]
hermes-quant-daemon = "hermes_quant.daemon.main:main"
hermes-quant-trainer = "hermes_quant.training.main:main"

[tool.setuptools]
packages = [
    "hermes_quant",
    "hermes_quant.analysts",
    "hermes_quant.aggregators",
    "hermes_quant.cli",
    "hermes_quant.config",
    "hermes_quant.consumers",
    "hermes_quant.consumers.freqtrade",
    "hermes_quant.daemon",
    "hermes_quant.data",
    "hermes_quant.evaluation",
    "hermes_quant.options",
    "hermes_quant.options.pricing",
    "hermes_quant.risk",
    "hermes_quant.schemas",
    "hermes_quant.skills",
    "hermes_quant.training",
]

[tool.setuptools.package-data]
hermes_quant = [
    "plugin.yaml",
    "skills/**/*",
    "consumers/freqtrade/*.py",
    "consumers/freqtrade/*.json.example",
    "options/pricing/LICENSE.optlib",
    "options/pricing/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]   # long lines OK in docstrings and ADR-derived comments

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "requires_network: tests that hit live network (skipped in CI; manually run before release)",
    "timeout(N): per-test timeout in seconds (pytest-timeout)",
]
