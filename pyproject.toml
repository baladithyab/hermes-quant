[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-quant"
version = "0.6.4"
description = "ARIA-powered multi-analyst algorithmic trading framework, distributed as a Hermes Agent plugin."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Codeseys" }]
keywords = [
    "hermes-agent",
    "trading",
    "algorithmic-trading",
    "quant",
    "kronos",
    "freqtrade",
    "alpaca",
    "rl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "httpx>=0.25",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2",   # imported module-level in 18 agents/* files (schemas, LLM caller, committees); was only present transitively
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.40", "pyyaml>=6.0"]
# Crypto data + execution
ccxt = ["ccxt>=4.2"]
# US equities data + execution
alpaca = ["alpaca-py>=0.30"]
# Alpha Vantage equity OHLCV fallback tier (B22). `requests` is already a
# transitive base dep; this extra is symbolic (mirrors the empty `options`
# extra) so consumers can opt-in explicitly.
alphavantage = ["requests>=2.31"]
# Kronos foundation-model analyst (heavy: torch + HF)
kronos = [
    "torch>=2.0",
    "transformers>=4.35",
    "huggingface_hub>=0.20",
    "einops>=0.7",
    "safetensors>=0.4",
]
# Bayesian / stacking aggregator extras
stacking = ["scikit-learn>=1.3", "scipy>=1.11"]
# Backtest reporting + visualization
backtest = ["matplotlib>=3.7", "seaborn>=0.13"]
# MLflow integration (optional — defaults to file backend)
mlflow = ["mlflow>=2.10"]
# Options pricing kernel — pure-Python, vendored from optlib (MIT).
# scipy is already pulled in via [stacking]; numpy is a base dep.
# Empty extra is kept so consumers can opt-in symbolically (e.g. `pip install hermes-quant[options]`).
options = []
# Convenience: full feature set excluding GPU-only torch builds
all = [
    "hermes-quant[yfinance,ccxt,alpaca,alphavantage,kronos,stacking,backtest,mlflow,options]",
]
# Dev / testing
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.1",
    "ruff>=0.1",
    "mypy>=1.7",
]
# Test bundle: all optional extras the test suite touches.
# Use `uv pip install -e '.[test]'` to set up a clean dev environment that
# can run the full test suite without ModuleNotFoundError on optional deps.
# v0.6.3 (ADR none): extracted from the implicit set the suite was depending on.
test = [
    "hermes-quant[dev]",
    "hermes-quant[stacking]",
    "hermes-quant[ccxt]",
    "hermes-quant[alpaca]",
    "hermes-quant[alphavantage]",
    "hermes-quant[yfinance]",
    "hermes-quant[backtest]",
    "pyarrow>=15.0",
]

[project.entry-points."hermes_agent.plugins"]
hermes-quant = "hermes_quant"

[project.entry-points."hermes_quant.analysts"]
classical_ta = "hermes_quant.analysts.classical_ta:ClassicalTAAnalyst"
microstructure_lite = "hermes_quant.analysts.microstructure:MicrostructureLite"
kronos = "hermes_quant.analysts.kronos:KronosAnalyst"
hermes_semantic = "hermes_quant.analysts.semantic:HermesSemanticAnalyst"

[project.entry-points."hermes_quant.aggregators"]
bma = "hermes_quant.aggregators.bma:BMAAggregator"
# NOTE: the `stacking` aggregator is planned (ADR-0003 reserves a logistic
# stacking aggregator; bma.py references StackingAggregator; scheduled v0.1.3).
# Its entry point is intentionally NOT declared until aggregators/stacking.py
# lands — a dangling `stacking = ...:StackingAggregator` line makes
# discover_aggregators() log a "failed to load entry point" warning on every
# daemon boot (ModuleNotFoundError). Re-add this line in the same commit that
# adds the module. The `[stacking]` dependency extra below stays — scikit-learn
# and scipy are already used (calibrators.py, factors/, options/pricing/gbs.py).
deliberative_committee = "hermes_quant.aggregators.deliberative:DeliberativeCommitteeAggregator"

# Registry-open plays (ADR-0082 Part A continuation). A third-party play can be
# declared here as `my_play = "my_pkg.module:my_play_profile"` (a PlayProfile, a
# zero-arg factory returning one, or a mapping). hermes_quant.playbook.play_loader
# discovers this group — but ONLY when HERMES_QUANT_PLAYS_OPEN=1 (default-OFF). No
# built-in members: the off-state registry is byte-identical to the built-in 5.
[project.entry-points."hermes_quant.plays"]

[project.entry-points."hermes_quant.data_providers"]
yfinance = "hermes_quant.data.yfinance_provider:YFinanceProvider"
ccxt = "hermes_quant.data.ccxt_provider:CcxtProvider"
alphavantage = "hermes_quant.data.alphavantage_provider:AlphaVantageProvider"
# NOTE (B22, R-B22): the `alpaca` data-provider entry point was removed —
# `hermes_quant/data/alpaca_provider.py` does not exist, so the dangling line
# made `discover_data_providers()` log a "failed to load entry point" warning
# on every daemon boot (same anti-pattern as the `stacking` aggregator note
# above). Re-add `alpaca = "...alpaca_provider:AlpacaProvider"` in the same
# commit that lands the module. The `[alpaca]` dependency extra stays (the
# alpaca-py SDK is used by the execution side).

[project.scripts]
hermes-quant-daemon = "hermes_quant.daemon.main:main"
hermes-quant-trainer = "hermes_quant.training.main:main"

[tool.setuptools]
# Auto-discover every hermes_quant.* package. The previous hand-maintained list
# pinned only 16 of 45 real packages — a NON-editable wheel/sdist would silently
# omit catalyst/governance/evidence/react/perception/factors/playbook/… and
# import-crash (the editable .pth install masks this because it loads live source).
# `find` keeps the package set in sync with the tree automatically. ("skills" is a
# data dir, not a package — it has no __init__ and ships via package-data below.)

[tool.setuptools.packages.find]
include = ["hermes_quant*"]
exclude = ["tests*", "ops*", "docs*"]

[tool.setuptools.package-data]
hermes_quant = [
    "plugin.yaml",
    "skills/**/*",
    "consumers/freqtrade/*.py",
    "consumers/freqtrade/*.json.example",
    "options/pricing/LICENSE.optlib",
    "options/pricing/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]   # long lines OK in docstrings and ADR-derived comments

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
# Global per-test wall-clock cap so a single genuinely-HUNG test (deadlock,
# infinite loop, unguarded live-network call that never returns) can't stall
# the whole suite forever. Set generously: this suite has legitimate
# model-loading backtests (Kronos/torch init + SSL fetches) that run ~175s,
# so the cap must clear those — it exists to kill INFINITE hangs, not slow-but-
# valid tests. pytest-timeout is in dev deps; a test that needs even longer
# overrides with @pytest.mark.timeout(N).
timeout = 300
markers = [
    "requires_network: tests that hit live network (skipped in CI; manually run before release)",
    "timeout(N): per-test timeout in seconds (pytest-timeout)",
    "slow: long-running tests (e.g. full-universe load sweep); opt-in via env, not a CI gate",
]
